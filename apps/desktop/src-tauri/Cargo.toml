[package]
name = "relio-desktop"
version = "0.0.0"
description = "Relio desktop application"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "relio-desktop"
path = "src/main.rs"
required-features = ["desktop-runtime"]

[features]
default = []
desktop-runtime = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.143"
portable-pty = "=0.9.0"
thiserror = "=2.0.16"
time = { version = "=0.3.43", features = ["formatting", "serde", "serde-well-known"] }
tauri = { version = "=2.11.5", default-features = false, features = ["wry"], optional = true }
ts-rs = { version = "=11.0.1", features = ["serde-compat", "uuid-impl"] }
uuid = { version = "=1.18.1", features = ["serde", "v7"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.28.0", default-features = false, features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
win32job = "=2.0.3"

[dev-dependencies]
proptest = "=1.11.0"

[lints]
workspace = true
